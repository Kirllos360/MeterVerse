name: CI - Tests and Quality

on:
  push:
    branches: [clean-main, main]
  pull_request:
    branches: [clean-main, main]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: meterverse_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5433/meterverse_test

      - name: Run unit tests
        run: npm test
        working-directory: backend

      - name: Run coverage
        run: npm run test:coverage
        working-directory: backend

      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: backend
        continue-on-error: false

  test-integration:
    name: Integration & Contract Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: meterverse_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5433/meterverse_test

      - name: Push schema to test database
        run: npx prisma db push --skip-generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5433/meterverse_test

      - name: Seed test database
        run: npm run db:seed
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5433/meterverse_test
          JWT_SECRET: ci-test-secret
        continue-on-error: true

      - name: Start backend (dev mode)
        run: |
          NODE_ENV=development PORT=3131 DATABASE_URL=postgresql://test:test@localhost:5433/meterverse_test JWT_SECRET=ci-test-secret SYMBIOT_TCP_PORT=9100 SYMBIOT_HTTP_PORT=9101 node src/server.js &
          echo "backend started"
        working-directory: backend
        env:
          NODE_ENV: development
          PORT: "3131"
          DATABASE_URL: postgresql://test:test@localhost:5433/meterverse_test
          JWT_SECRET: ci-test-secret
          SYMBIOT_TCP_PORT: "9100"
          SYMBIOT_HTTP_PORT: "9101"

      - name: Wait for backend health
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3131/api/health > /dev/null; then
              echo "backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy"
          exit 1

      - name: Run integration tests
        run: npm run test:integration
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5433/meterverse_test
          JWT_SECRET: ci-test-secret

      - name: Run contract tests
        run: npm run test:contract
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5433/meterverse_test
          JWT_SECRET: ci-test-secret
          CONTRACT_BASE_URL: http://localhost:3131


  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: Frontend
      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: Frontend
        continue-on-error: true
      - name: Build
        run: npm run build
        working-directory: Frontend
      - name: Test
        run: npm test
        working-directory: Frontend

  graphiti-validate:
    name: Graphiti Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install graphify
        run: pip install graphifyy -q
      - name: Validate manifest
        run: |
          python -c "
          import json
          with open('graphify-out/manifest.json') as f:
            m = json.load(f)
          paths = list(m.keys())[:5]
          print(f'Graph manifest: {len(m)} entries')
          print(f'Sample paths: {paths}')
          bad = [p for p in m if 'Meter-' in p]
          if bad:
            print(f'WARNING: {len(bad)} entries still have wrong path prefix')
          else:
            print('All paths verified correct')
          "
