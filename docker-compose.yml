version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meter_pulse
      POSTGRES_USER: meter_pulse
      POSTGRES_PASSWORD: meter_pulse_dev
    ports:
      # Host access aligned with backend/.env (5433). Container-internal is
      # still 5432 (services connect via the `postgres` network name).
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meter_pulse -d meter_pulse 2>/dev/null || pg_isready 2>/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  admin-backend:
    build: ./backend
    ports:
      - "3131:3131"
    environment:
      PORT: 3131
      DATABASE_URL: postgresql://meter_pulse:meter_pulse_dev@postgres:5432/meter_pulse?schema=public
      JWT_SECRET: mv-jwt-secret-change-in-production-2026
      CORS_ORIGIN: http://localhost:3030,http://localhost:3535
    depends_on:
      postgres:
        condition: service_healthy

  portal-backend:
    build: ./backend
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      PORTAL_MODE: "1"
      DATABASE_URL: postgresql://meter_pulse:meter_pulse_dev@postgres:5432/meter_pulse?schema=public
      JWT_SECRET: mv-jwt-secret-change-in-production-2026
      CORS_ORIGIN: http://localhost:3030,http://localhost:3535
    depends_on:
      postgres:
        condition: service_healthy

  admin-frontend:
    build: ./Frontend
    ports:
      - "3535:3535"
    environment:
      NEXT_PUBLIC_API_URL: http://admin-backend:3131/api
    depends_on:
      - admin-backend

  portal-frontend:
    build: ./Frontend
    ports:
      - "3030:3030"
    environment:
      PORTAL_MODE: "1"
      NEXT_PUBLIC_API_URL: http://portal-backend:3003/api
    depends_on:
      - portal-backend

volumes:
  pgdata:
